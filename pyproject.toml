[project]
name = "docs-rag-assistant"
version = "0.1.0"
description = "RAG assistant: ask questions over your own documents, answers with citations"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
